name: Lokum Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Cache HuggingFace & NLTK Models
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/huggingface
          ~/nltk_data
        key: ${{ runner.os }}-models-${{ hashFiles('pyproject.toml') }}
        
    - name: Install dependencies
      env:
        SYSTEM_VERSION_COMPAT: "0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -v mlx faiss-cpu
        pip install .
        pip install pytest pytest-cov
        
    - name: Run Tests
      env:
        PYTHONPATH: src
      run: |
        pytest tests/ --cov=lokum_engine --cov-report=xml

    - name: Upload pip log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pip-log-${{ matrix.python-version }}
        path: pip_log.txt
